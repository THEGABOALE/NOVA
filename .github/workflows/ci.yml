name: CI

# Valida el backend, el móvil y la landing en cada push/PR a main, para que un
# cambio que rompe algo se note antes de mergear en vez de después. La landing
# corre sus tests, el lint y el build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  mobile-tests:
    name: Mobile (lint + tests + debug + release)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      # "packages" fijo a solo platform-tools: en la v3 el default de esta
      # action llego a pedir tambien el paquete "tools", que Google
      # descontinuo del repositorio del SDK y ya no existe, y eso rompia el
      # setup entero con "Failed to find package 'tools'". Se deja explicito
      # para no depender del default de cada version.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      # Sin esto, Gradle no puede descargar sola la plataforma/build-tools que
      # falten (compileSdk se actualiza seguido y no siempre viene preinstalada
      # en el runner).
      - name: Aceptar licencias del SDK de Android
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Dar permiso de ejecución al wrapper
        run: chmod +x gradlew

      # El bundle de CI queda sin firma; nunca usa la clave debug.
      - run: ./gradlew lintDebug testDebugUnitTest assembleDebug bundleRelease assembleDebugAndroidTest -PNOVA_ALLOW_UNSIGNED_RELEASE=true --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-reports
          path: |
            mobile/app/build/reports/
            mobile/app/schemas/
            mobile/app/build/outputs/mapping/release/mapping.txt

  mobile-instrumented:
    name: Mobile UI (${{ matrix.device }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            api: 29
            profile: pixel_2
          - device: tablet
            api: 35
            profile: Nexus 9
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x gradlew
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          profile: ${{ matrix.profile }}
          arch: x86_64
          target: google_apis
          working-directory: mobile
          disable-animations: true
          script: |
            if [ "${{ matrix.device }}" = "tablet" ]; then
              adb shell settings put system accelerometer_rotation 0
              adb shell settings put system user_rotation 1
            fi
            ./gradlew connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-instrumented-${{ matrix.device }}
          path: mobile/app/build/reports/androidTests/


  landing-checks:
    name: Landing (test + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: landing/package-lock.json

      # Los webfonts con licencia se descargan de R2 en el build de producción y
      # no pueden versionarse en este repo público (ni con `git add -f`).
      - name: Webfonts con licencia fuera de Git
        run: |
          tracked="$(git ls-files public/fonts/)"
          if [ -n "$tracked" ]; then
            echo "::error::Los webfonts con licencia no pueden versionarse:"
            echo "$tracked"
            exit 1
          fi

      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run build
